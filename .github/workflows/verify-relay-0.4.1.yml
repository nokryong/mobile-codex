name: Verify public relay and APK for 0.4.1
on:
  push:
    branches: [verify/diagnostic-relay-0.4.1]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public relay without a valid proof and read the previous update manifest
        shell: python
        run: |
          import hashlib, json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          
          origin = 'https://mobile-codex-diagnostic-relay.vercel.app'
          def request(path, payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = Request(origin + path, data=body, headers={'Content-Type': 'application/json', 'User-Agent': 'Mobile-Codex-release-check'})
              try:
                  result = urlopen(req, timeout=20)
              except HTTPError as error:
                  result = error
              with result:
                  assert result.geturl() == origin + path
                  return result.status, json.load(result)
          
          assert request('/api/health') == (200, {'schema': 1, 'ready': True})
          print('Public production health returned 200 with ready=true', flush=True)
          
          # Never request a challenge. The fixed proof fails before the relay can publish.
          challenge = 'a' * 48
          assert not hashlib.sha256((challenge + ':0').encode()).hexdigest().startswith('0000')
          v1 = dict(schema=1, reportId='00000000-0000-4000-8000-000000000001', appVersion='0.3.6',
                    runtime='codex_01621', errorCode='relay_verification', operation='other', stage='unknown',
                    homeKind='unknown', elapsedMs=0, spawnMs=-1, writeMs=-1, firstByteMs=-1, responseMs=-1,
                    processAlive=False, exitCode=-1, stdoutBytes=0, stdoutLines=0, invalidJson=0, unmatchedIds=0,
                    stderrBytes=0, stderrCategory='none', androidApi=35, abi='arm64', manufacturer='other',
                    deviceClass='phone', ramClass='unknown', pageSize='unknown', challengeId=challenge, proof=0)
          v2 = dict(v1, schema=2, appVersion='0.4.0', operation='login', errorCode='login_failed',
                    elapsedMs=None, processAlive=None, stdoutBytes=None, stdoutLines=None, invalidJson=None,
                    unmatchedIds=None, stderrBytes=None)
          v3 = dict(v2, schema=3, appVersion='0.4.1', stage='login_account_apply', failureKind='unknown')
          cases = [
              ('schema 1', v1, 'invalid_proof'),
              ('schema 2', v2, 'invalid_proof'),
              ('schema 3: local account', v3, 'invalid_proof'),
              ('schema 3: device code request', dict(v3, stage='login_rpc', failureKind='timeout'), 'invalid_proof'),
              ('schema 3: unsupported stage', dict(v3, stage='unsupported'), 'invalid_schema'),
              ('schema 3: unsupported kind', dict(v3, failureKind='unsupported'), 'invalid_schema'),
              ('schema 3: unexpected field', dict(v3, extra=0), 'invalid_schema'),
          ]
          for label, sample, expected in cases:
              status, value = request('/api/reports', sample)
              assert (status, value) == (400, {'error': expected}), (label, status, value.get('error'))
              print(label, status, expected, flush=True)
          
          url = 'https://github.com/nokryong/mobile-codex/releases/download/v0.4.0/mobile-codex-update.json'
          with urlopen(url, timeout=20) as response:
              manifest = response.read(4096)
          assert hashlib.sha256(manifest).hexdigest() == '991bbc897e4e47f0fa7c7f7414ebbe9b9a2dfb10e1ac6627014c9b0a4fd0db0f'
          old = json.loads(manifest)
          assert old['versionName'] == '0.4.0' and old['versionCode'] == 75
          assert old['applicationId'] == 'dev.mobilecodex.app'
          assert old['signingCertificateSha256'] == ['f9a8d59abf5ab33b44879ade1b9500c385b2cf03e1cb17f94936eadb85337bd7']
          print('Published 0.4.0 (75) manifest bytes and pinned signing certificate verified', flush=True)
      - name: Download the public APK and verify signatures, signed identity and six assets
        shell: python
        run: |
          import hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          from urllib.request import urlopen
          
          owner = 'nokryong/mobile-codex'
          release = json.load(urlopen('https://api.github.com/repos/' + owner + '/releases/latest', timeout=20))
          assert release['tag_name'] == 'v0.4.1' and not release['draft'] and not release['prerelease']
          apk_name = 'mobile-codex-0.4.1-arm64.apk'
          files = {item['name']: item for item in release['assets']}
          expected = {apk_name, apk_name + '.sha256', 'mobile-codex-update.json', 'devtools-corresponding-source.zip', 'LICENSE', 'THIRD_PARTY_NOTICES.md'}
          assert expected == set(files)
          assert all(item['state'] == 'uploaded' and item['size'] > 0 and re.fullmatch('sha256:[0-9a-f]{64}', item['digest']) for item in files.values())
          directory = Path(tempfile.mkdtemp())
          for name in [apk_name, apk_name + '.sha256', 'mobile-codex-update.json']:
              asset = files[name]
              url = 'https://github.com/' + owner + '/releases/download/v0.4.1/' + name
              assert asset['browser_download_url'] == url
              with urlopen(url, timeout=60) as response, (directory / name).open('wb') as output:
                  assert response.status == 200 and response.geturl().startswith('https://')
                  digest = hashlib.sha256()
                  while block := response.read(1024 * 1024):
                      output.write(block)
                      digest.update(block)
              assert (directory / name).stat().st_size == asset['size']
              assert asset['digest'] == 'sha256:' + digest.hexdigest()
          manifest = json.loads((directory / 'mobile-codex-update.json').read_text())
          apk = directory / apk_name
          apk_sha = files[apk_name]['digest'].split(':', 1)[1]
          assert (directory / (apk_name + '.sha256')).read_text() == apk_sha + '  ' + apk_name + '\n'
          cert = 'f9a8d59abf5ab33b44879ade1b9500c385b2cf03e1cb17f94936eadb85337bd7'
          expected_manifest = dict(applicationId='dev.mobilecodex.app', versionCode=76, versionName='0.4.1', minimumSdk=29,
                                   abi='arm64-v8a', fileName=apk_name, size=apk.stat().st_size, sha256=apk_sha,
                                   signingCertificateSha256=[cert], debuggable=False, testOnly=False)
          assert manifest == expected_manifest
          builds = Path(os.environ['ANDROID_HOME']) / 'build-tools'
          tools = max((p for p in builds.iterdir() if re.fullmatch(r'\d+\.\d+\.\d+', p.name) and (p/'apksigner').is_file()), key=lambda p: tuple(map(int, p.name.split('.'))))
          def run(argv):
              return subprocess.run([str(a) for a in argv], check=True, capture_output=True, text=True).stdout
          signed = run([tools/'apksigner', 'verify', '--verbose', '--print-certs', apk])
          assert re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)$', signed, re.M) == [cert]
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in signed or 'Verified using v3 scheme (APK Signature Scheme v3): true' in signed
          badging = run([tools/'aapt2', 'dump', 'badging', apk])
          assert re.search(r"^package: name='dev\.mobilecodex\.app' versionCode='76' versionName='0\.4\.1'", badging, re.M)
          assert "sdkVersion:'29'" in badging and re.findall(r'^native-code:\s*(.*)$', badging, re.M) == ["'arm64-v8a'"]
          assert 'application-debuggable' not in badging and 'application-testOnly' not in badging
          xml = run([tools / 'aapt2', 'dump', 'xmltree', apk, '--file', 'AndroidManifest.xml'])
          assert 'E: application' in xml
          for name in ['debuggable', 'testOnly']:
              flags = re.findall(r'A: android:' + name + r'\([^\n]*', xml)
              assert all(re.fullmatch(r'A: android:' + name + r'\(0x[0-9a-fA-F]+\)=\(type 0x12\)0x0\s*', flag) for flag in flags)
          print('Verified public download:', files[apk_name]['browser_download_url'])
          print('APK bytes:', apk.stat().st_size, 'SHA-256:', apk_sha)
          print('APK signature certificate SHA-256:', cert)
          print('Android identity: dev.mobilecodex.app 0.4.1 (76), arm64-v8a, minSdk 29')
          print('All six standard release assets are present. The APK, manifest and checksum match.')
