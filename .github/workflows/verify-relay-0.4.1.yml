name: Verify public relay for 0.4.1
on:
  push:
    branches: [verify/diagnostic-relay-0.4.1]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public relay without a valid proof and read the previous update manifest
        shell: python
        run: |
          import hashlib, json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          
          origin = 'https://mobile-codex-diagnostic-relay.vercel.app'
          def request(path, payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = Request(origin + path, data=body, headers={'Content-Type': 'application/json', 'User-Agent': 'Mobile-Codex-release-check'})
              try:
                  result = urlopen(req, timeout=20)
              except HTTPError as error:
                  result = error
              with result:
                  assert result.geturl() == origin + path
                  return result.status, json.load(result)
          
          assert request('/api/health') == (200, {'schema': 1, 'ready': True})
          print('Public production health returned 200 with ready=true', flush=True)
          
          # Never request a challenge. The fixed proof fails before the relay can publish.
          challenge = 'a' * 48
          assert not hashlib.sha256((challenge + ':0').encode()).hexdigest().startswith('0000')
          v1 = dict(schema=1, reportId='00000000-0000-4000-8000-000000000001', appVersion='0.3.6',
                    runtime='codex_01621', errorCode='relay_verification', operation='other', stage='unknown',
                    homeKind='unknown', elapsedMs=0, spawnMs=-1, writeMs=-1, firstByteMs=-1, responseMs=-1,
                    processAlive=False, exitCode=-1, stdoutBytes=0, stdoutLines=0, invalidJson=0, unmatchedIds=0,
                    stderrBytes=0, stderrCategory='none', androidApi=35, abi='arm64', manufacturer='other',
                    deviceClass='phone', ramClass='unknown', pageSize='unknown', challengeId=challenge, proof=0)
          v2 = dict(v1, schema=2, appVersion='0.4.0', operation='login', errorCode='login_failed',
                    elapsedMs=None, processAlive=None, stdoutBytes=None, stdoutLines=None, invalidJson=None,
                    unmatchedIds=None, stderrBytes=None)
          v3 = dict(v2, schema=3, appVersion='0.4.1', stage='login_account_apply', failureKind='unknown')
          cases = [
              ('schema 1', v1, 'invalid_proof'),
              ('schema 2', v2, 'invalid_proof'),
              ('schema 3: local account', v3, 'invalid_proof'),
              ('schema 3: device code request', dict(v3, stage='login_rpc', failureKind='timeout'), 'invalid_proof'),
              ('schema 3: unsupported stage', dict(v3, stage='unsupported'), 'invalid_schema'),
              ('schema 3: unsupported kind', dict(v3, failureKind='unsupported'), 'invalid_schema'),
              ('schema 3: unexpected field', dict(v3, extra=0), 'invalid_schema'),
          ]
          for label, sample, expected in cases:
              status, value = request('/api/reports', sample)
              assert (status, value) == (400, {'error': expected}), (label, status, value.get('error'))
              print(label, status, expected, flush=True)
          
          url = 'https://github.com/nokryong/mobile-codex/releases/download/v0.4.0/mobile-codex-update.json'
          with urlopen(url, timeout=20) as response:
              manifest = response.read(4096)
          assert hashlib.sha256(manifest).hexdigest() == '991bbc897e4e47f0fa7c7f7414ebbe9b9a2dfb10e1ac6627014c9b0a4fd0db0f'
          old = json.loads(manifest)
          assert old['versionName'] == '0.4.0' and old['versionCode'] == 75
          assert old['applicationId'] == 'dev.mobilecodex.app'
          assert old['signingCertificateSha256'] == ['f9a8d59abf5ab33b44879ade1b9500c385b2cf03e1cb17f94936eadb85337bd7']
          print('Published 0.4.0 (75) manifest bytes and pinned signing certificate verified', flush=True)
