name: Verify production diagnostic relay
on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      production_url:
        description: 'Approved production alias; verifies v2 and legacy reports (up to two synthetic issues)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: diagnostic-relay-live-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Verify schema 2 nulls, idempotent retry, public payload and schema 1
        env:
          REPORT_RELAY_URL: ${{ inputs.production_url || 'https://mobile-codex-diagnostic-relay.vercel.app' }}
        run: node tools/verify_diagnostic_relay.mjs "$REPORT_RELAY_URL"
